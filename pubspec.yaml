name: salesperson_daily_recorder
version: 1.1.0+2
publish_to: 'none'
description: Offline sales and collections recorder with SQLite, local repositories, validation, and PDF reporting.

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  pdf: ^3.11.1
  share_plus: ^10.0.2
  crypto: ^3.0.5
  file_picker: ^10.3.10
  mobile_scanner: ^7.2.0
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - biocare logo1.png
    - biocare logo1_dark.png
    - Login hero.png
    - Dashboard background.png
    - Sales module image.png
    - Collections module image.png
    - Reports screen image.png
    - Shops_customer management.png
    - Products_catalog.png
    - Settings_security.png
    - Empty state for sales or collections.png
    - Subtle reusable background texture.png
